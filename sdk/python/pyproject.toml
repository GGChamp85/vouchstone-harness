[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vouchstone-sdk"
version = "1.4.0"
description = "Python SDK for the Vouchstone Enterprise AI Agent Platform — build, deploy, and govern AI agents with 5-layer memory, document vault, and enterprise knowledge ingestion"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Vouchstone LLC", email = "renu@vouchstone.ai"},
]
keywords = ["ai", "agents", "memory", "enterprise", "vouchstone"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "numpy>=1.24.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
redis = ["redis[hiredis]>=5.0.0"]
vector = ["chromadb>=0.4.0", "qdrant-client>=1.7.0"]
graph = ["neo4j>=5.0.0", "asyncpg>=0.29.0"]
otel = ["opentelemetry-api>=1.20.0", "opentelemetry-sdk>=1.20.0"]
all = ["redis[hiredis]>=5.0.0", "chromadb>=0.4.0", "qdrant-client>=1.7.0", "neo4j>=5.0.0", "asyncpg>=0.29.0", "opentelemetry-api>=1.20.0", "opentelemetry-sdk>=1.20.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "black", "mypy", "opentelemetry-api>=1.20.0", "opentelemetry-sdk>=1.20.0"]

[project.urls]
Homepage = "https://vouchstone.ai"
Repository = "https://github.com/GGChamp85/Vouchstone"
Documentation = "https://vouchstone.ai/docs"

[tool.setuptools.packages.find]
include = ["vouchstone_sdk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
