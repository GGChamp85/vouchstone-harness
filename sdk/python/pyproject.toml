[build-system]
# >=83.0.0: fixes PYSEC-2026-3447 (MANIFEST.in exclude/prune matching did no
# Unicode normalization, so an NFD-named file on macOS APFS/HFS+ could bypass
# an NFC-written exclusion rule and get packed into a published sdist).
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vouchstone-sdk"
version = "1.6.0"
description = "Python SDK for the Vouchstone Enterprise AI Agent Platform — build, deploy, and govern AI agents with 5-layer memory, document vault, and enterprise knowledge ingestion"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Vouchstone LLC", email = "renu@vouchstone.ai"},
]
keywords = ["ai", "agents", "memory", "enterprise", "vouchstone"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core stays deliberately lean: transport (httpx), models (pydantic), async
# file IO (aiofiles). LLM vendor clients are extras -- an enterprise SDK must
# not force every install to pull two vendor SDKs it may never call; every
# LLM-touching code path imports lazily and raises a clear ImportError naming
# the extra to install. (numpy was removed outright: it was a declared
# dependency with zero imports anywhere in the package.)
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
llm-openai = ["openai>=1.0.0"]
llm-anthropic = ["anthropic>=0.18.0"]
redis = ["redis[hiredis]>=5.0.0"]
vector = ["chromadb>=0.4.0", "qdrant-client>=1.7.0"]
graph = ["neo4j>=5.0.0", "asyncpg>=0.29.0"]
otel = ["opentelemetry-api>=1.20.0", "opentelemetry-sdk>=1.20.0"]
all = ["openai>=1.0.0", "anthropic>=0.18.0", "redis[hiredis]>=5.0.0", "chromadb>=0.4.0", "qdrant-client>=1.7.0", "neo4j>=5.0.0", "asyncpg>=0.29.0", "opentelemetry-api>=1.20.0", "opentelemetry-sdk>=1.20.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.4", "mypy>=1.8", "openai>=1.0.0", "anthropic>=0.18.0", "opentelemetry-api>=1.20.0", "opentelemetry-sdk>=1.20.0", "pip-audit>=2.7"]

[project.scripts]
vouchstone = "vouchstone_sdk.cli:main"

[project.urls]
Homepage = "https://vouchstone.ai"
Repository = "https://github.com/GGChamp85/Vouchstone"
Documentation = "https://vouchstone.ai/docs"

[tool.setuptools.packages.find]
include = ["vouchstone_sdk*"]

[tool.setuptools.package-data]
vouchstone_sdk = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes core; I: import order; UP: py310+ idioms;
# B: bugbear (real-bug catchers); ASYNC: async foot-guns.
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
    "E501",  # line length is advisory here; long URLs/messages are common
]

[tool.mypy]
# NOTE: this is mypy's type-checking target, independent of `requires-python
# = ">=3.10"` above (that's the SDK's runtime support floor; ruff's
# `target-version = "py310"` + the UP lint rules are what actually guard
# against 3.10-incompatible syntax in vouchstone_sdk itself). It's pinned to
# CI's tested interpreter (3.12, see sdk-ci.yml/publish-sdk.yml) because
# some optional-extra transitive deps (numpy 2.x's own stub, pulled in by
# chromadb/qdrant-client in the `all`/`vector` extras -- not a direct
# dependency of this package) ship stub syntax (PEP 695 `type` statements)
# that only parses under python_version>=3.12. Under a lower target, mypy
# hard-aborts the entire run on that stub's syntax before per-module
# overrides (ignore_errors, follow_imports=skip) even get a chance to
# apply, since imports found inside stub files are always followed
# regardless of follow_imports (see follow_imports_for_stubs in mypy docs).
python_version = "3.12"
packages = ["vouchstone_sdk"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
